<svg xmlns="http://www.w3.org/2000/svg" width="480" height="200" viewBox="0 0 480 200" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<clipPath id="r"><rect width="480" height="200" rx="14"/></clipPath>
<linearGradient id="a" x1="0" y1="0" x2="1" y2="0" spreadMethod="reflect"><stop offset="0" stop-color="#3fb950"/><stop offset="1" stop-color="#a371f7"/>
<animateTransform attributeName="gradientTransform" type="translate" from="-1 0" to="1 0" dur="5s" repeatCount="indefinite"/></linearGradient>
</defs>
<g clip-path="url(#r)">
<rect width="480" height="200" fill="#0d1117"/>
<rect width="480" height="4" fill="url(#a)"/>
<circle cx="450" cy="32" r="5" fill="#3fb950"><animate attributeName="r" values="4;7;4" dur="2.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0.3;1" dur="2.5s" repeatCount="indefinite"/></circle>
<text x="24" y="44" font-family="'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif" font-size="21" font-weight="700" fill="#e6edf3">APIScout</text>
<text x="24" y="68" font-family="'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif" font-size="13" font-style="italic" fill="#8b949e">Hackathon • solo build</text>
<text x="24" y="108" font-family="'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif" font-size="14" fill="#c9d1d9">Scrapes REST API docs and auto-generates</text><text x="24" y="130" font-family="'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif" font-size="14" fill="#c9d1d9">typed Python wrappers using an LLM.</text>
<rect x="24" y="152" width="66" height="26" rx="13" fill="#161b22" stroke="#3fb950" stroke-opacity="0.55"/><text x="57" y="169" text-anchor="middle" font-family="'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif" font-size="12" fill="#c9d1d9">Python</text><rect x="98" y="152" width="44" height="26" rx="13" fill="#161b22" stroke="#3fb950" stroke-opacity="0.55"/><text x="120" y="169" text-anchor="middle" font-family="'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif" font-size="12" fill="#c9d1d9">LLM</text><rect x="151" y="152" width="111" height="26" rx="13" fill="#161b22" stroke="#3fb950" stroke-opacity="0.55"/><text x="206" y="169" text-anchor="middle" font-family="'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif" font-size="12" fill="#c9d1d9">Web Scraping</text>
</g>
<rect x="0.5" y="0.5" width="479" height="199" rx="14" fill="none" stroke="#30363d"/>
