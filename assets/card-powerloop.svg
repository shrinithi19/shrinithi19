<circle cx="450" cy="32" r="5" fill="#f0883e"><animate attributeName="r" values="4;7;4" dur="2.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0.3;1" dur="2.5s" repeatCount="indefinite"/></circle>
<text x="24" y="44" font-family="'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif" font-size="21" font-weight="700" fill="#e6edf3">Powerloop</text>
<text x="24" y="68" font-family="'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif" font-size="13" font-style="italic" fill="#8b949e">Computer vision</text>
<text x="24" y="108" font-family="'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif" font-size="14" fill="#c9d1d9">Real-time occupancy detection</text><text x="24" y="130" font-family="'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif" font-size="14" fill="#c9d1d9">using YOLOv8.</text>
<rect x="24" y="152" width="66" height="26" rx="13" fill="#161b22" stroke="#f0883e" stroke-opacity="0.55"/><text x="57" y="169" text-anchor="middle" font-family="'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif" font-size="12" fill="#c9d1d9">Python</text><rect x="98" y="152" width="66" height="26" rx="13" fill="#161b22" stroke="#f0883e" stroke-opacity="0.55"/><text x="132" y="169" text-anchor="middle" font-family="'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif" font-size="12" fill="#c9d1d9">YOLOv8</text><rect x="173" y="152" width="133" height="26" rx="13" fill="#161b22" stroke="#f0883e" stroke-opacity="0.55"/><text x="239" y="169" text-anchor="middle" font-family="'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif" font-size="12" fill="#c9d1d9">Computer Vision</text>
